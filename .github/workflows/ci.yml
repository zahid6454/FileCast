name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to match api/requirements-dev.txt so local and CI never disagree
      # on formatting.
      - run: pip install ruff==0.8.6
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .

  js-lint:
    name: Lint & format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Biome version is pinned in package.json; `biome ci` checks format + lint.
      - run: npx biome ci .

  js-test:
    name: Tests (vitest + Playwright)
    runs-on: ubuntu-latest
    # No Postgres service on purpose. All three of build.py's DB reads degrade to
    # a warning line and never fail the build (P10), so the suite runs against a
    # no-DB build: no #tool-ratings island, no homepage conversion badge. Verified
    # locally with postgres stopped — all 56 specs pass. The rating THRESHOLD
    # maths is unit-tested in vitest precisely so no e2e assertion needs baked
    # rating data (see the header comment of e2e/rating.spec.js).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # jsdom only, no build needed — runs first so a unit failure reports fast.
      - name: Unit tests (vitest)
        run: npx vitest run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Root requirements.txt only: these tests drive the built dist/, not the API.
      - name: Install build dependencies
        run: pip install -r requirements.txt
      # playwright.config.js serves dist/ via `python -m http.server`, so dist/
      # must exist before the browser starts. API_URL is pinned to a guaranteed-
      # non-resolving host (.invalid is IANA-reserved, RFC 2606/6761) rather than
      # left to inherit site-config.yaml's real api.base_url — these E2E specs
      # are written to exercise the "API unreachable" path hermetically (see
      # rating.spec.js's "no console error" assertions), and must not depend on
      # whether the production domain happens to resolve.
      - name: Build site
        env:
          API_URL: https://api.filecast.invalid
        run: python build.py
      - run: npx playwright install --with-deps chromium
      # --workers=2: the static preview server is single-threaded and the suite
      # has been observed to flake at higher parallelism.
      - name: E2E tests (Playwright)
        run: npx playwright test --project=chromium --workers=2

  test:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filecast
          POSTGRES_PASSWORD: filecast_dev
          POSTGRES_DB: filecast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filecast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Same URL for Alembic (DATABASE_URL) and the test harness (TEST_DATABASE_URL).
      DATABASE_URL: postgresql+psycopg://filecast:filecast_dev@localhost:5432/filecast_test
      TEST_DATABASE_URL: postgresql+psycopg://filecast:filecast_dev@localhost:5432/filecast_test
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the API Docker image
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
            requirements.txt
      - name: Install dependencies
        # Root requirements.txt adds the SSG deps (jinja2/markdown/…) so the
        # Phase 2 build tests can drive build.py end-to-end.
        run: pip install -r requirements.txt -r api/requirements.txt -r api/requirements-dev.txt
      - name: Migration integrity (applies cleanly + matches models)
        working-directory: api
        run: |
          alembic upgrade head
          alembic check
      - name: Run tests
        working-directory: api
        run: pytest -q
