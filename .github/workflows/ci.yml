name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege default (O4 audit item #16): every job here only reads the
# checked-out repo (lint/test), never pushes, comments, or calls the GitHub
# API for a write. No job needs more than this.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pinned to match api/requirements-dev.txt so local and CI never disagree
      # on formatting.
      - run: pip install ruff==0.8.6
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .

  js-lint:
    name: Lint & format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      # Biome version is pinned in package.json; `biome ci` checks format + lint.
      - run: npx biome ci .

  js-test:
    name: Tests (vitest + Playwright)
    runs-on: ubuntu-latest
    # No Postgres service on purpose. All three of build.py's DB reads degrade to
    # a warning line and never fail the build (P10), so the suite runs against a
    # no-DB build: no #tool-ratings island, no homepage conversion badge. Verified
    # locally with postgres stopped — all 56 specs pass. The rating THRESHOLD
    # maths is unit-tested in vitest precisely so no e2e assertion needs baked
    # rating data (see the header comment of e2e/rating.spec.js).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # jsdom 30 (via undici) requires Node ^22.22.2 || ^24.15.0 || >=26 —
          # on Node 20 it throws `webidl.util.markAsUncloneable is not a
          # function` at import time before a single spec runs. 24 matches
          # the LTS this repo's own dev machines already run.
          node-version: "24"
          cache: npm
      - run: npm ci
      # jsdom only, no build needed — runs first so a unit failure reports fast.
      - name: Unit tests (vitest)
        run: npx vitest run
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Root requirements.txt only: these tests drive the built dist/, not the API.
      - name: Install build dependencies
        run: pip install -r requirements.txt
      # playwright.config.js serves dist/ via `python -m http.server`, so dist/
      # must exist before the browser starts. API_URL is pinned to a guaranteed-
      # non-resolving host (.invalid is IANA-reserved, RFC 2606/6761) rather than
      # left to inherit site-config.yaml's real api.base_url — these E2E specs
      # are written to exercise the "API unreachable" path hermetically (see
      # rating.spec.js's "no console error" assertions), and must not depend on
      # whether the production domain happens to resolve.
      - name: Build site
        env:
          API_URL: https://api.filecast.invalid
        run: python build.py
      - run: npx playwright install --with-deps chromium
      # --workers=2: the static preview server is single-threaded and the suite
      # has been observed to flake at higher parallelism.
      - name: E2E tests (Playwright)
        run: npx playwright test --project=chromium --workers=2

  test:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filecast
          POSTGRES_PASSWORD: filecast_dev
          POSTGRES_DB: filecast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filecast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Phase 3: the rate limiter and job-worker tests hit a real Redis
      # (same "hit the real dependency, don't mock" posture as postgres
      # above) — without this the suite breaks outright once any test
      # touches it.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # NEON_FAILOVER_PLAN.md §12: the real-binary node_sync test needs a
      # genuine v18 SERVER, not just v18 client tools — v18 pg_dump/pg_restore
      # embed v18-only session GUCs (e.g. `SET transaction_timeout = 0`) that
      # the main `postgres:16` service above (matching this repo's actual
      # production server version) rejects outright. Real Neon deployments run
      # v18 on both sides, so this second service exists purely to let that
      # one test exercise a matching pair for real; distinct port (5433) so it
      # doesn't clash with the v16 service. Everything else in this job keeps
      # targeting the v16 service above — that's still what production runs.
      postgres18:
        image: postgres:18
        env:
          POSTGRES_USER: filecast
          POSTGRES_PASSWORD: filecast_dev
          POSTGRES_DB: filecast_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U filecast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Same URL for Alembic (DATABASE_URL) and the test harness (TEST_DATABASE_URL).
      DATABASE_URL: postgresql+psycopg://filecast:filecast_dev@localhost:5432/filecast_test
      TEST_DATABASE_URL: postgresql+psycopg://filecast:filecast_dev@localhost:5432/filecast_test
      TEST_REDIS_URL: redis://localhost:6379/1
      # scripts/node_sync.py's real-binary test only: a v18 server to match
      # the v18 client tools installed below (see the postgres18 service
      # above for why this can't just reuse TEST_DATABASE_URL's v16 server).
      TEST_NODE_SYNC_POSTGRES_URL: postgresql+psycopg://filecast:filecast_dev@localhost:5433/filecast_test
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"  # matches the API Docker image
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
            requirements.txt
      # NEON_FAILOVER_PLAN.md §7.5/§12: api/scripts/node_sync.py's real-binary
      # test needs actual pg_dump/pg_restore v18 (not this runner's default
      # v17) at the same conventional /usr/lib/postgresql/18/bin path the
      # Dockerfile's PGDG install produces — mirrors that same repo setup so
      # this test exercises the identical binaries the deployed image uses,
      # not a stand-in. The test itself skips gracefully if this step is
      # ever unavailable; this step itself is NOT allowed to fail silently.
      - name: Install postgresql-client-18 (PGDG apt repo)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
      - name: Install dependencies
        # Root requirements.txt adds the SSG deps (jinja2/markdown/…) so the
        # Phase 2 build tests can drive build.py end-to-end.
        run: pip install -r requirements.txt -r api/requirements.txt -r api/requirements-dev.txt
      - name: Migration integrity (applies cleanly + matches models)
        working-directory: api
        run: |
          alembic upgrade head
          alembic check
      - name: Run tests
        working-directory: api
        run: pytest -q
