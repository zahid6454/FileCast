# Ruff — one tool for formatting (black-compatible), import sorting (isort), and
# linting. Replaces black + isort + flake8. See CI: .github/workflows/ci.yml.
target-version = "py312"
line-length = 88

# Autogenerated Alembic migrations shouldn't fight the linter/formatter; dist/
# and .venv/ are build/venv artifacts.
extend-exclude = ["api/migrations", "dist", ".venv"]

[lint]
# E/W pycodestyle, F pyflakes, I import sorting (isort), UP pyupgrade, B bugbear.
select = ["E", "F", "I", "W", "UP", "B"]
# Line length is enforced by the formatter, not the linter (avoids noise on long
# strings/URLs/comments the formatter can't wrap).
ignore = ["E501"]

[lint.flake8-bugbear]
# FastAPI REQUIRES its dependency markers as argument defaults; they are not the
# mutable-default footgun B008 targets. Whitelist them so B008 stops flagging every route.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
]

[format]
quote-style = "double"
indent-style = "space"
