# PR #98 review, blocker 1: the Gotenberg --chromium-deny-list is text-based
# (matches URL literals, not resolved IPs) and the reviewer demonstrated it
# doesn't stop Chromium from reaching internal Docker services BY NAME
# (http://api:8090/..., http://postgres:5432/) — a bypass no regex can fully
# close on its own. Splitting into two networks closes the `postgres` vector
# structurally instead: gotenberg is never attached to `db`, so Docker's
# per-network bridge isolation means it has no route to postgres at all,
# regardless of hostname, DNS rebinding, or IP literal. `api` still shares
# `convert` with gotenberg (required — api is the one calling gotenberg's
# HTTP API), so gotenberg CAN still reach `api` at the network layer; that
# residual is real but bounded — everything gotenberg could reach there is
# require_admin/require_user-gated, and Chromium's fetch carries no FileCast
# session cookie, so it cannot authenticate as anything. The deny-list stays
# as one more layer and now also matches these service names literally.
networks:
  convert:
  db:

services:
  api:
    # An EXPLICIT shared tag, not compose's default per-service `<project>-<service>`
    # name. `build: .` on both services does NOT share an image — compose built
    # api-api and api-purge as separate images, and they drifted 12 days apart in
    # practice, which is precisely the "second thing to keep in sync" the purge
    # comment below says doesn't exist. One tag makes that true.
    image: filecast-api:local
    # Stamp the image with the commit it was built from. Empty when GIT_SHA is
    # unset — the Dockerfile's own default ("unknown") then applies, so a plain
    # `docker compose up -d --build` still works, it just cannot be verified.
    # To stamp: GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "8090:8090"
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://filecast:${POSTGRES_PASSWORD:-filecast_dev}@postgres:5432/filecast
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      gotenberg:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    # Needs all three: `convert` to reach gotenberg's HTTP API, `db` to reach
    # postgres (dev) / relay to Neon (prod, via the same DATABASE_URL env
    # var — network membership here doesn't affect an external host) and the
    # `redis` service alongside it.
    networks: [convert, db]
    restart: unless-stopped
    volumes:
      # Job-conversion bytes (Phase 3) — shared with `worker`, which is the
      # only thing that ever writes {id}.output; this service reads it back
      # on download and writes {id}.input on enqueue.
      - job_results:/app/job_results
    # No apt package added for this — python:3.12-slim already has Python, and
    # a 200-range response IS the check (mirrors gotenberg's `curl -sf`
    # below); urlopen raises on anything else, which is a non-zero exit.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/v1/health', timeout=3)"
        ]
      interval: 60m
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 1.5

  # The 30-day retention purge (D5/F13). This is THE single purge trigger —
  # one container, not one scheduler per uvicorn worker. Phase 7 specified a
  # host systemd timer instead, but that was a manual VPS step that never got
  # installed, so nothing purged and the privacy page's "auto-deleted after 30
  # days" promise went unkept. Shipping it as a service means it starts with
  # `docker compose up -d` and cannot be forgotten.
  #
  # If you install a host cron/timer instead, delete this service — exactly one
  # trigger (F13). Reuses the api image (`build: .`) so it shares the code and
  # DB config with no second thing to keep in sync. No ports, no inbound access.
  purge:
    # Same tag, context and args as `api` — that is what actually makes this one
    # image. The second build pass is a full cache hit, so it costs ~nothing and
    # resolves to the identical image id. A stale purge is not cosmetic: this
    # container IS the retention job, so an old image here means the "auto-deleted
    # after 30 days" promise is kept by whatever code shipped whenever it was last
    # built.
    image: filecast-api:local
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["python", "-m", "data.tasks", "purge", "--loop"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://filecast:${POSTGRES_PASSWORD:-filecast_dev}@postgres:5432/filecast
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks: [db]
    restart: unless-stopped
    # This loop has no server to poll (it wakes once a day — see data/tasks.py)
    # and a dead process already shows as "Exited" without a HEALTHCHECK, so
    # the useful failure mode to catch here is different: hung-but-still-alive
    # inside _run_once() forever. data/tasks.py's loop touches HEARTBEAT_PATH
    # once per iteration (success or handled failure) right before sleeping;
    # 48h is 2x the normal interval, generous enough that only a genuine hang
    # trips it. interval/retries are deliberately loose to match — this isn't
    # meant to catch anything fast, just to stop a silent, permanent stall.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,sys,tempfile,time; p=pathlib.Path(tempfile.gettempdir())/'purge-heartbeat'; sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 172800 else 1)"
        ]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 30s
    mem_limit: 256m
    cpus: 0.25

  # Async conversion job worker (Phase 3 — STRESS_TEST_PHASE3_PLAN.md). Own
  # compose service, same "exactly one trigger" reasoning as `purge` above —
  # a background task inside the 4-worker `api` app would mean 4 competing
  # discovery loops. Reuses the api image (`build: .`) so it shares the
  # TOOL_REGISTRY/convert code with no second thing to keep in sync.
  worker:
    image: filecast-api:local
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["python", "-m", "data.job_worker", "--loop"]
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://filecast:${POSTGRES_PASSWORD:-filecast_dev}@postgres:5432/filecast
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      # NOT service_healthy, unlike `api`'s own gotenberg dependency below —
      # Phase 3 stress test, Finding 2: a gotenberg still catching up from a
      # restart (unhealthy, not yet passing its own healthcheck) previously
      # blocked `docker compose up -d worker` outright ("dependency failed
      # to start: container api-gotenberg-1 is unhealthy"), so a worker
      # crash couldn't come back up until a human separately fixed
      # gotenberg first — turning one recoverable failure into two. The
      # worker doesn't actually need gotenberg healthy at its own startup:
      # every tool call already goes through _gotenberg_request's own
      # queue-timeout/busy handling, so a job claimed before gotenberg is
      # ready just gets the honest "busy, try again" outcome instead of
      # hanging. `api` keeps service_healthy — a visitor-facing request
      # arriving before gotenberg is ready has no such graceful path.
      gotenberg:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    # Needs all three, same as `api`: gotenberg for the actual conversion
    # calls, postgres for the job rows, redis for its wake-up BRPOP.
    networks: [convert, db]
    restart: unless-stopped
    volumes:
      - job_results:/app/job_results
    # Mirrors `purge`'s heartbeat-file healthcheck pattern exactly
    # (data/tasks.py's HEARTBEAT_PATH idiom) — touched once per loop
    # iteration so `docker stats`/monitoring can tell "alive and cycling"
    # apart from "process up but the event loop is wedged." Threshold is
    # much tighter than purge's 48h: this loop cycles at least every ~5s
    # (BRPOP_TIMEOUT_SECONDS), not once a day, so 2 minutes with no update is
    # already a strong signal something's stuck.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,sys,tempfile,time; p=pathlib.Path(tempfile.gettempdir())/'worker-heartbeat'; sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 120 else 1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    # Opts this container into `autoheal`'s restart sweep below — see that
    # service's own comment for why a healthcheck alone (this one already
    # existed) was never enough on its own.
    labels:
      - "autoheal=true"

  # Local Redis sidecar (Phase 3) — backs the cross-process rate limiter
  # (middleware.py) and the conversion worker's wake-up signal (job_worker.py
  # BRPOPs, converter.py LPUSHes). No persistence needed (both uses are
  # inherently ephemeral); tiny footprint. NOT gated behind `dev-only` (unlike
  # `postgres` below) — prod needs this same cross-worker guarantee dev
  # testing would otherwise miss, so it runs automatically there too
  # (docker-compose.prod.yml only overrides the host port publish away).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    cpus: 0.1

  gotenberg:
    image: gotenberg/gotenberg:8
    # SSRF hardening (OWASP A10): html-to-pdf and epub-to-pdf feed user-uploaded
    # content straight into Chromium, which will fetch any <img>/<link>/CSS
    # url() reference it finds in that HTML — including internal hostnames or a
    # cloud metadata address — unless told not to. Deny-list, not allow-list, so
    # legitimate external images in a real HTML upload still resolve; only
    # loopback/RFC1918/link-local targets are blocked. Every other flag keeps
    # its module default — Gotenberg (Cobra/pflag) only overrides flags that
    # are actually passed.
    command:
      # Adds the actual internal Docker service names this stack uses
      # (api/gotenberg/postgres/purge — the exact bypass demonstrated in the
      # PR #98 review, "http://api:8090/..." and "http://postgres:5432/")
      # alongside the IP-literal patterns. `db`-network isolation (see the
      # top-level `networks:` comment) is what actually closes the postgres
      # case structurally; this is defense-in-depth on top of that, not a
      # substitute for it — text matching alone can never fully close this
      # class of bypass (DNS rebinding to a literal IP address is still
      # unaddressed by either layer).
      - "gotenberg"
      - "--chromium-deny-list=.*(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|::1|10\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|192\\.168\\.|169\\.254\\.|\\bapi\\b|\\bpostgres\\b|\\bpurge\\b|\\bgotenberg\\b).*"
      # STRESS_TEST_REPORT.md Finding 1: 6 concurrent html-to-pdf jobs on a
      # realistic ~12MB HTML upload maxed out this container's original 1GB
      # mem_limit and wedged it permanently (CPU ~20x a core, memory 98%+,
      # still unhealthy 2+ minutes later, needed a manual restart) — the
      # factory default of 6 lets in more simultaneous Chromium renders than
      # fit in 1GB for realistic documents. Verified locally with
      # scripts/stress_test.py (same repro: 6 concurrent ~12.7MB html-to-pdf
      # requests) that 1, 2, and 3 all avoid the permanent lockup — each
      # recovers to idle memory within a few seconds instead of staying
      # pinned. 2 is the highest of those that still leaves real headroom.
      #
      # STRESS_TEST_PHASE3_REPORT.md Finding 1 (round two): a HEAVIER but
      # still-realistic file — same overall size, more embedded images (32
      # vs. the original repro's fewer/larger ones) — reproduced the exact
      # same permanent-lockup behavior essentially unchanged at this same
      # concurrency=2, and dropping to 1 only delayed the onset (Gotenberg's
      # own logs showed its *internal Chromium browser health check*
      # starting to fail — "context deadline exceeded" — i.e. the browser
      # subprocess itself was going unresponsive under memory pressure, not
      # just queueing behind other work). Concurrency alone can't fix that:
      # even one render of this file shape gets close enough to a 1GB
      # ceiling to risk it. See mem_limit below — the fix that actually
      # changed the outcome in testing was headroom, not a lower cap here.
      - "--chromium-max-concurrency=2"
      # Default is unlimited — once max-concurrency is hit, every extra
      # request just waits in an ever-growing line (the 30s queue wait in
      # Finding 1's log) instead of being turned away. Bounded per the
      # report's §1b so a full queue rejects fast (429 "maximum queue size
      # exceeded", confirmed in local testing) instead of piling up.
      - "--chromium-max-queue-size=5"
      - "--libreoffice-max-queue-size=5"
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /home/gotenberg/.cache
    # STRESS_TEST_PHASE3_REPORT.md Finding 1 (round two): raised from the
    # original 1g/1.0 — verified locally (scripts/stress_test.py, the same
    # 6-concurrent heavy-file repro that broke 1g at every concurrency
    # setting from 1-3) that headroom, not a tighter concurrency cap, is
    # what actually stops the permanent wedge. At 3g/1.5, the identical
    # burst produced at least one real success, honest 503 "busy" responses
    # for the rest (not silent/unresponsive), and a full self-recovery to
    # idle memory within under 2 minutes with no manual restart — none of
    # which happened at 1g regardless of concurrency. 12GB VM (DEVELOPMENT.md)
    # with api(2g)/purge(256m)/worker(512m)/redis(64m) totaling ~2.8GB
    # together leaves ample room for gotenberg's extra 2g here.
    mem_limit: 3g
    cpus: 1.5
    # NOT `db` — see the top-level `networks:` comment. This is the
    # structural half of the SSRF fix: gotenberg has no route to postgres
    # at all, regardless of what hostname/IP a malicious upload references.
    networks: [convert]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Opts this container into `autoheal`'s restart sweep below — see that
    # service's own comment for why this existing healthcheck was never
    # enough on its own to recover from a wedge (STRESS_TEST_PHASE3_REPORT.md
    # Finding 1: the container's own top-level process never crashes even
    # while its internal Chromium browser is unresponsive, so
    # `restart: unless-stopped` — which only reacts to the container process
    # exiting, not to healthcheck status — never fires).
    labels:
      - "autoheal=true"

  # STRESS_TEST_PHASE3_REPORT.md Findings 1 & 2: both are, underneath their
  # different triggers (a heavy burst vs. a worker crash mid-request),
  # ultimately the same problem — gotenberg (and observed here, the worker
  # too) can end up unhealthy/dead without its own container process ever
  # exiting, so plain `restart: unless-stopped` never fires and a human has
  # to notice and run a manual restart. Docker Compose (outside Swarm) has
  # no native "restart on unhealthy" behavior of its own — the container
  # HEALTHCHECKs above already detect this correctly, nothing before this
  # ever acted on it. willfarrell/autoheal is a small (~5MB), single-purpose,
  # widely-used image built for exactly this: it watches the Docker API for
  # containers whose HEALTHCHECK has been failing and restarts them. Scoped
  # to only the two containers labeled `autoheal=true` above (`gotenberg`,
  # `worker`) via AUTOHEAL_CONTAINER_LABEL, not every container on the host —
  # `api`/`purge` don't opt in, so a real bug in either still surfaces
  # normally instead of being silently restarted away.
  #
  # Needs the Docker socket to call the Docker API — a broad grant (whoever
  # holds it can control any container on the host), which is exactly why
  # it lives in its own minimal single-purpose container instead of being
  # added to `api`/`worker`, both of which process untrusted uploads and
  # must never hold this. no-new-privileges/cap_drop mirror gotenberg's own
  # hardening; this container makes no outbound network calls of its own
  # beyond the Docker socket, so it isn't attached to `convert` or `db`.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # A touch above the labeled containers' own retries*interval (gotenberg:
      # 5*10s=50s, worker: 3*30s=90s) so autoheal acts on a healthcheck that's
      # already had a fair chance to recover on its own, not the first blip.
      - AUTOHEAL_START_PERIOD=90
      - AUTOHEAL_INTERVAL=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1

  # Local-only Postgres for dev. Not started by a bare `docker compose up` —
  # requires `--profile dev-only` (see dev.bat/README.md). Prod points
  # DATABASE_URL at Neon instead (docker-compose.prod.yml); this service
  # never runs there.
  postgres:
    profiles: ["dev-only"]
    image: postgres:16
    environment:
      POSTGRES_USER: filecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filecast_dev}
      POSTGRES_DB: filecast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filecast"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  # Job-conversion bytes (Phase 3), shared between `api` and `worker` — a
  # fresh named volume is root-owned by default regardless of mount path;
  # api/Dockerfile's mkdir+chown step is what makes it writable by appuser.
  job_results:
