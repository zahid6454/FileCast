services:
  api:
    # An EXPLICIT shared tag, not compose's default per-service `<project>-<service>`
    # name. `build: .` on both services does NOT share an image — compose built
    # api-api and api-purge as separate images, and they drifted 12 days apart in
    # practice, which is precisely the "second thing to keep in sync" the purge
    # comment below says doesn't exist. One tag makes that true.
    image: filecast-api:local
    # Stamp the image with the commit it was built from. Empty when GIT_SHA is
    # unset — the Dockerfile's own default ("unknown") then applies, so a plain
    # `docker compose up -d --build` still works, it just cannot be verified.
    # To stamp: GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "8090:8090"
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://filecast:${POSTGRES_PASSWORD:-filecast_dev}@postgres:5432/filecast
    depends_on:
      gotenberg:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # The 30-day retention purge (D5/F13). This is THE single purge trigger —
  # one container, not one scheduler per uvicorn worker. Phase 7 specified a
  # host systemd timer instead, but that was a manual VPS step that never got
  # installed, so nothing purged and the privacy page's "auto-deleted after 30
  # days" promise went unkept. Shipping it as a service means it starts with
  # `docker compose up -d` and cannot be forgotten.
  #
  # If you install a host cron/timer instead, delete this service — exactly one
  # trigger (F13). Reuses the api image (`build: .`) so it shares the code and
  # DB config with no second thing to keep in sync. No ports, no inbound access.
  purge:
    # Same tag, context and args as `api` — that is what actually makes this one
    # image. The second build pass is a full cache hit, so it costs ~nothing and
    # resolves to the identical image id. A stale purge is not cosmetic: this
    # container IS the retention job, so an old image here means the "auto-deleted
    # after 30 days" promise is kept by whatever code shipped whenever it was last
    # built.
    image: filecast-api:local
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["python", "-m", "data.tasks", "purge", "--loop"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://filecast:${POSTGRES_PASSWORD:-filecast_dev}@postgres:5432/filecast
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /home/gotenberg/.cache
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Local-only Postgres for dev. Not started by a bare `docker compose up` —
  # requires `--profile dev-only` (see dev.bat/README.md). Prod points
  # DATABASE_URL at Neon instead (docker-compose.prod.yml); this service
  # never runs there.
  postgres:
    profiles: ["dev-only"]
    image: postgres:16
    environment:
      POSTGRES_USER: filecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filecast_dev}
      POSTGRES_DB: filecast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filecast"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
