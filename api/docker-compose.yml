services:
  api:
    build: .
    ports:
      - "8090:8090"
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://filecast:${POSTGRES_PASSWORD:-filecast_dev}@postgres:5432/filecast
    depends_on:
      gotenberg:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /home/gotenberg/.cache
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: filecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filecast_dev}
      POSTGRES_DB: filecast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filecast"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
