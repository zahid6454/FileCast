site:
  name: FileCast
  tagline: "Free Online File Converter | PDF, Image & Data Tools"
  base_url: https://filecast.org
  # SEO Phase 1 (O2 report §4.4/§13 #6): describes the product (what/how many/
  # free) instead of only the privacy model, while keeping the P15 "most tools"
  # qualifier (ledger §9) — still false to claim ALL processing is in-browser
  # given the 6 server-side tools. NOTE: since Phase 7 this field is also
  # stored in site_settings (id=1) and the DB overlay WINS at build time, so
  # editing this line alone is a no-op on any environment that has a settings
  # row. Migration 0008 corrects the row.
  description: "Convert documents, images, and data files for free — 34 tools, no sign-up, no limits. Most conversions happen in your browser. PDF, DOCX, PNG, JPG, CSV, JSON, and more."

adsense:
  enabled: false
  publisher_id: ""
  slots:
    leaderboard: ""
    in_content: ""
    footer: ""

ga4:
  enabled: false
  measurement_id: ""

sentry:
  enabled: false
  dsn: ""

api:
  base_url: https://api.filecast.org

categories:
  - id: document-tools
    name: Document Conversion
    nav_label: Document
    # URL standardized to the {type}-conversion/ pattern (O2 report §4.1/§13
    # #11); `id` is left as `document-tools` since it's also the value stored
    # in tool.category across 11 tool YAMLs, seed.py's DB fallback order, and
    # api/tests — only the public-facing slug changes. The old /document-tools/
    # path 301s to this one via build.py's generate_redirects().
    slug: document-conversion
    description: "Convert documents to PDF, merge, split, compress, and transform PDF files. Most tools run in your browser."
    search_placeholder: "Filter tools... (e.g. DOCX, PDF, merge, compress)"

  - id: image-conversion
    name: Image Conversion
    nav_label: Image
    slug: image-conversion
    # The old text ("Your files never leave your device") was only
    # *accidentally* true — every image tool happens to be client-side today.
    # As a category-level promise it breaks silently the first time a
    # server-side image tool is added, so it is hedged like document-tools
    # above; the per-tool Local/Cloud badge carries the exact claim.
    description: "Convert between image formats instantly. Most tools run entirely in your browser — nothing is uploaded."
    search_placeholder: "Filter tools... (e.g. PNG, WebP, TIFF)"

  - id: developer-tools
    # Renamed from "Data Conversion" (Build Action Plan Phase 0) — the
    # category is no longer just conversions (JSON Formatter, Hash Generator,
    # QR Code Generator, JWT Decoder don't convert anything), so "Developer
    # Tools" matches how comparable sites (CodeBeautify, FreeFormatter) label
    # this exact tool set.
    name: Developer Tools
    nav_label: Developer
    slug: developer-tools
    # Opens with three verbs (not just "Convert") since the category covers
    # formatters/validators/generators too. Still says "convert" in the first
    # sentence since the id/slug dropped the word. "Most tools," matching the
    # hedge the other two categories use, not "all," so this doesn't become
    # false the day a server-processed Developer tool is added.
    description: "Format, convert, and validate developer data — JSON, XML, YAML, CSV, and Base64. Most tools run entirely in your browser."
    search_placeholder: "Filter tools... (e.g. JSON, XML, YAML)"
