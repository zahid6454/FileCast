enabled: true
id: pdf-extract-pages
name: "PDF Extract Pages"
slug: /convert/pdf-extract-pages
category: document-conversion
subcategory: utility
type: client-side
input_format: PDF
output_format: PDF
accept_extensions: [.pdf]
output_extension: .pdf
js_module: converters/pdf-extract-pages.js
# pdf-lib runs inside a dedicated Worker (P4 §36) — see static/js/workers/pdf-lib-worker.js.
worker_libs: [pdf-lib.min.js]
max_file_size: 50MB
bulk_support: false
ui_type: standard
options:
  - id: pages
    label: "Pages to extract"
    type: text
    default: ""
    placeholder: "e.g. 1-3, 5, 8-10"
tagline: "Pull specific pages into a new PDF"
tagline_long: "Extract the pages you list into a brand-new PDF, in the order you list them — entirely in your browser, no upload required."
meta:
  title: "PDF Extract Pages — Free, No Upload | FileCast"
  description: "Extract pages from a PDF free online — runs entirely in your browser, nothing uploaded. No sign-up, no limits, no watermarks. List page numbers or ranges to pull."
  keywords: ["extract pdf pages", "pdf page extractor", "pull pages from pdf", "get pages from pdf", "extract pdf pages free"]
content:
  what_is: "content/pdf-extract-pages/what-is.md"
  comparison: "content/pdf-extract-pages/comparison.md"
  when_to_use: "content/pdf-extract-pages/when-to-use.md"
  faq: "content/pdf-extract-pages/faq.md"
related_tools: [pdf-remove-pages, pdf-split, pdf-organize, pdf-merge]
