enabled: true
id: pdf-rotate
name: PDF Rotate
slug: /convert/pdf-rotate
category: document-tools
subcategory: pdf-operations
type: client-side
input_format: PDF
output_format: PDF
accept_extensions: [.pdf]
output_extension: .pdf
js_module: converters/pdf-rotate.js
# pdf-lib runs inside a dedicated Worker (P4 §36) — see static/js/workers/pdf-lib-worker.js.
worker_libs: [pdf-lib.min.js]
max_file_size: 50MB
bulk_support: false
ui_type: standard
options:
  - id: rotation
    label: "Rotation"
    type: select
    default: "90"
    choices:
      - { value: "90", label: "90° clockwise" }
      - { value: "180", label: "180°" }
      - { value: "270", label: "90° counter-clockwise" }
tagline: "Rotate PDF pages to the correct orientation"
tagline_long: "Rotate all pages in a PDF by 90, 180, or 270 degrees — entirely in your browser, no upload required."
meta:
  title: "Rotate PDF Pages — Free, Private, No Upload"
  description: "Rotate PDF pages instantly in your browser. No upload, no server — your files stay private."
  keywords: ["rotate pdf", "pdf rotate", "turn pdf pages", "rotate pdf pages", "rotate pdf free"]
content:
  what_is: "content/pdf-rotate/what-is.md"
  comparison: "content/pdf-rotate/comparison.md"
  when_to_use: "content/pdf-rotate/when-to-use.md"
  faq: "content/pdf-rotate/faq.md"
related_tools: [pdf-split, pdf-merge, pdf-to-png, image-to-pdf]
