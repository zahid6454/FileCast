enabled: true
id: pdf-merge
name: PDF Merge
slug: /convert/pdf-merge
category: document-tools
subcategory: pdf-operations
type: client-side
input_format: PDF
output_format: PDF
accept_extensions: [.pdf]
output_extension: .pdf
js_module: converters/pdf-merge.js
# pdf-lib runs inside a dedicated Worker (P4 §36), not on the main thread — see
# static/js/workers/pdf-lib-worker.js. worker_libs (not js_libs) so no unused
# 500KB <script> tag loads on the page itself.
worker_libs: [pdf-lib.min.js]
max_file_size: 50MB
max_files: 10
bulk_support: true
ui_type: multi-file
convert_label: "Merge PDFs"
tagline: "Combine multiple PDFs into one file"
tagline_long: "Merge two or more PDF files into a single document — entirely in your browser, no upload required."
meta:
  title: "PDF Merge — Combine PDFs Free, No Upload | FileCast"
  description: "Merge PDF files free online — runs entirely in your browser, nothing uploaded. No sign-up, no limits, no watermarks. Combine two or more PDFs into a single document."
  keywords: ["merge pdf", "combine pdf", "pdf merge", "join pdf", "merge pdf files free"]
content:
  what_is: "content/pdf-merge/what-is.md"
  comparison: "content/pdf-merge/comparison.md"
  when_to_use: "content/pdf-merge/when-to-use.md"
  faq: "content/pdf-merge/faq.md"
related_tools: [pdf-split, pdf-rotate, image-to-pdf, pdf-to-png]
