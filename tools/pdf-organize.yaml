enabled: true
id: pdf-organize
name: "PDF Organize"
slug: /convert/pdf-organize
category: document-conversion
subcategory: utility
type: client-side
input_format: PDF
output_format: PDF
accept_extensions: [.pdf]
output_extension: .pdf
js_module: converters/pdf-organize.js
# pdf-lib runs inside a dedicated Worker (P4 §36) — see static/js/workers/pdf-lib-worker.js.
worker_libs: [pdf-lib.min.js]
max_file_size: 50MB
bulk_support: false
ui_type: standard
options:
  - id: order
    label: "New page order"
    type: text
    default: ""
    placeholder: "e.g. 3,1,2,4"
tagline: "Reorder the pages in a PDF"
tagline_long: "Rearrange every page of a PDF into the exact order you specify — entirely in your browser, no upload required."
meta:
  title: "PDF Organize — Free, No Upload | FileCast"
  description: "Reorder PDF pages free online — runs entirely in your browser, nothing uploaded. No sign-up, no limits, no watermarks. List the new page order and download instantly."
  keywords: ["reorder pdf pages", "organize pdf pages", "rearrange pdf pages", "pdf page order", "reorder pdf free"]
content:
  what_is: "content/pdf-organize/what-is.md"
  comparison: "content/pdf-organize/comparison.md"
  when_to_use: "content/pdf-organize/when-to-use.md"
  faq: "content/pdf-organize/faq.md"
related_tools: [pdf-extract-pages, pdf-remove-pages, pdf-rotate, pdf-merge]
