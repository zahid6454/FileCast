enabled: true
id: pdf-page-numbers
name: "PDF Page Numbers"
slug: /convert/pdf-page-numbers
category: document-conversion
subcategory: utility
type: client-side
input_format: PDF
output_format: PDF
accept_extensions: [.pdf]
output_extension: .pdf
js_module: converters/pdf-page-numbers.js
# pdf-lib runs inside a dedicated Worker (P4 §36) — see static/js/workers/pdf-lib-worker.js.
# pdf.js runs inside a second dedicated Worker (static/js/workers/pdf-render-worker.js)
# to build the live position-preview page proof — worker_libs (not js_libs),
# same lazy-load posture, loaded only once a file is picked.
worker_libs: [pdf-lib.min.js, pdf.min.js]
shared_js: [shared-page-proof.js]
max_file_size: 50MB
bulk_support: false
ui_type: standard
options:
  - id: position
    label: "Position"
    type: select
    default: "bottom-center"
    choices:
      - { value: "bottom-center", label: "Bottom Center" }
      - { value: "bottom-left", label: "Bottom Left" }
      - { value: "bottom-right", label: "Bottom Right" }
      - { value: "top-center", label: "Top Center" }
      - { value: "top-left", label: "Top Left" }
      - { value: "top-right", label: "Top Right" }
  - id: startNumber
    label: "Start at"
    type: number
    min: 1
    max: 9999
    default: 1
    placeholder: "1"
    suffix: ""
  - id: format
    label: "Format"
    type: select
    default: "n"
    choices:
      - { value: "n", label: "1, 2, 3…" }
      - { value: "page-n", label: "Page 1, Page 2…" }
      - { value: "page-of-total", label: "Page 1 of N…" }
      - { value: "custom", label: "Custom Text" }
  - id: fontFamily
    label: "Font"
    type: select
    default: "Helvetica"
    choices:
      - { value: "Helvetica", label: "Helvetica" }
      - { value: "HelveticaBold", label: "Helvetica Bold" }
      - { value: "TimesRoman", label: "Times" }
      - { value: "TimesRomanBold", label: "Times Bold" }
      - { value: "Courier", label: "Courier" }
      - { value: "CourierBold", label: "Courier Bold" }
  - id: fontSize
    label: "Size"
    type: select
    default: "10"
    choices:
      - { value: "8", label: "8pt" }
      - { value: "9", label: "9pt" }
      - { value: "10", label: "10pt" }
      - { value: "11", label: "11pt" }
      - { value: "12", label: "12pt" }
      - { value: "14", label: "14pt" }
      - { value: "16", label: "16pt" }
      - { value: "18", label: "18pt" }
      - { value: "20", label: "20pt" }
      - { value: "24", label: "24pt" }
  # Shown only when format is "custom" — hidden_by_default (templates/tool.html)
  # renders the row already hidden so it doesn't flash visible before
  # pdf-page-numbers.js's updateCustomTextVisibility() hides it on load; that
  # same function shows/hides it thereafter as Format changes. No length
  # limit is enforced beyond maxlength — pageNumbers() in pdf-lib-worker.js
  # shrinks the font and, failing that, truncates with an ellipsis so the
  # stamp can never overflow the page margin regardless of what's typed here.
  - id: customText
    label: "Custom text"
    type: text
    default: ""
    placeholder: "Max 60 characters"
    maxlength: 60
    hidden_by_default: true
tagline: "Add page numbers — or your own text — to every page"
tagline_long: "Stamp page numbers, or your own custom text, onto every page of a PDF, in the position, font, and format you choose — entirely in your browser, no upload required."
meta:
  title: "PDF Page Numbers — Free, No Upload | FileCast"
  description: "Add page numbers to a PDF free online — runs entirely in your browser, nothing uploaded. No sign-up, no limits, no watermarks. Choose position, start number, and format."
  keywords: ["add page numbers to pdf", "pdf page numbers", "number pdf pages", "insert page numbers pdf", "pdf pagination free"]
content:
  what_is: "content/pdf-page-numbers/what-is.md"
  comparison: "content/pdf-page-numbers/comparison.md"
  when_to_use: "content/pdf-page-numbers/when-to-use.md"
  faq: "content/pdf-page-numbers/faq.md"
related_tools: [pdf-watermark, pdf-organize, pdf-merge, pdf-crop]
